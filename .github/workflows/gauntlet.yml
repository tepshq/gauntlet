name: gauntlet
# **PR の回がゲート、push の回はマージ後の確認。**
#
# main は ruleset で守ってある（PR 必須 / required status check は `gauntlet` /
# bypass なし。2026-08-13）ので、直接 push はリモートが拒否する。**全量検査を通らずに
# main に入る経路は無い。** 0.24.5 で push トリガを足したときの理由（直コミット運用では
# `pull_request` だけだと CI が一度も走らない。0.24.4 までの 10 コミット超が未通過）は
# これで消えたが、トリガは残す — 別々に緑だった PR がマージで壊す形（意味的な衝突）は、
# push の回でしか見えない。
#
# **push の回は mutation が回らない。** 差分の起点が HEAD に並ぶので変異対象が 0 になる。
# mutation が実際に回るのは PR の回だけ、という非対称は承知の上。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base を取るために全履歴が要る。浅いと差分の起点が決まらない。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run build
      # lint は gauntlet のゲートから外した（0.18.0）。リポジトリの CI が回す。
      - run: npm run lint
      # 自分自身を測るので、registry からではなくビルド結果を直接叩く。
      - run: node dist/cli.js full
