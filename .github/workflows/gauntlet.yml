name: gauntlet
# **push も見る。** gauntlet 自身は main 直コミット運用なので、`pull_request` だけだと
# CI が一度も走らない — SKILL が他のリポジトリに「設定はあるので済んだように見えるのに、
# 全量検査が事実上存在しない」と警告している状態に、自分が当たっていた（0.24.4 までの
# 10 コミット超が CI 未通過）。
#
# **これは通知であってゲートではない**（既にコミット済みのものを事後に検査するだけ）。
# このリポジトリで止める力を持っているのはコミットフックの `quick` で、`full` は
# 「quick が見ない層（全量の CRAP・重複・mutation）が壊れたら知る」ための後追い。
# push の回は差分の起点が HEAD に並ぶので**変異対象が 0 になる** — mutation が実際に
# 回るのは PR の回だけ、という非対称も承知の上（PR を使うときは今までどおり回る）。
on:
  push:
    branches: [main]
  pull_request

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base を取るために全履歴が要る。浅いと差分の起点が決まらない。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run build
      # lint は gauntlet のゲートから外した（0.18.0）。リポジトリの CI が回す。
      - run: npm run lint
      # 自分自身を測るので、registry からではなくビルド結果を直接叩く。
      - run: node dist/cli.js full
